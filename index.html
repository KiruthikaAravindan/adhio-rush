<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mario Rush</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Mobile only: shown in portrait via CSS (body.is-touch) -->
  <div id="landscape-prompt">
    <div class="rotate-anim">📱</div>
    <p>Rotate your device to play</p>
  </div>

  <!-- Mobile only: welcome / info modal -->
  <div id="welcome-modal">
    <div class="modal-box">
      <h1>🎵 Mario Rush</h1>
      <p>Collect music notes &nbsp;·&nbsp; Stomp enemies</p>
      <p>Hit <strong style="color:#FFD700">?</strong> boxes for music quizzes!</p>
      <div class="hint-row">
        <span>🕹 &nbsp;Drag to move</span>
        <span>▲ &nbsp;Jump</span>
        <span>↺ &nbsp;Restart</span>
      </div>
      <button id="btn-start">▶ &nbsp;TAP TO PLAY</button>
    </div>
  </div>

  <!-- Game container — JS scales this to fill the screen -->
  <div id="game-wrap">

    <!-- Mini HUD: score + lives always visible during play -->
    <div id="mini-hud">
      <span>⭐ <span id="score-mini">0</span></span>
      <span>❤️ <span id="lives-mini">3</span></span>
    </div>

    <!-- Hamburger menu button — large tap target, top-right -->
    <button id="btn-menu" aria-label="Menu">☰</button>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- Mobile only: virtual joystick + jump -->
    <div id="touch-controls">
      <div id="joystick">
        <div id="joy-knob"></div>
      </div>
      <button class="tbtn tbtn-jump" id="btn-jump">▲</button>
      <button class="tbtn tbtn-fs" id="btn-fs">⛶</button>
      <button class="tbtn tbtn-restart" id="btn-restart">↺</button>
    </div>

    <button id="btn-action" class="hidden"></button>

    <!-- Combined stats + settings panel -->
    <div id="hud-panel" class="hidden">
      <div class="settings-title">🎵 MARIO RUSH</div>
      <div class="hud-stats">
        <div class="hud-stat-row"><span class="stat-lbl">🎮 Level</span><span class="stat-num" id="level">1</span></div>
        <div class="hud-stat-row"><span class="stat-lbl">⭐ Score</span><span class="stat-num" id="score">0</span></div>
        <div class="hud-stat-row"><span class="stat-lbl">🏆 Best</span><span class="stat-num" id="best">0</span></div>
        <div class="hud-stat-row"><span class="stat-lbl">❤️ Lives</span><span class="stat-num" id="lives">3</span></div>
        <div class="hud-stat-row"><span class="stat-lbl">♪ Notes</span><span class="stat-num" id="coins">0</span></div>
      </div>
      <div class="hud-divider"></div>
      <div class="settings-row">
        <span>Music</span>
        <button id="tog-music" class="tog-btn">ON</button>
      </div>
      <div class="settings-row">
        <span>Sound FX</span>
        <button id="tog-sfx" class="tog-btn">ON</button>
      </div>
      <button id="btn-menu-close">✕ Close</button>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
