<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ihdā'</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Mobile only: shown in portrait via CSS (body.is-touch) -->
  <div id="landscape-prompt">
    <div class="rotate-anim">📱</div>
    <p>Rotate your device to play</p>
  </div>

  <!-- Mobile only: welcome / info modal -->
  <div id="welcome-modal">
    <div class="modal-box">
      <h1>🎵 Ihdā': Shooo the Cooos! 🐦</h1>
      <p>Chase the 🎵 notes &nbsp;·&nbsp; Bonk the baddies</p>
      <p>Smash a <strong style="color:#FFD700">?</strong> box — brace for a music quiz!</p>
      <div class="hint-row desktop-hints">
        <span>← → &nbsp;Strut</span>
        <span>Space &nbsp;Flap!</span>
      </div>
      <div class="hint-row touch-hints">
        <span>◀ ▶ &nbsp;Move</span>
        <span>▲ &nbsp;Flap!</span>
      </div>
      <button id="btn-start">▶ &nbsp;TAP TO PLAY</button>
    </div>
  </div>

  <!-- Game container — JS scales this to fill the screen -->
  <div id="game-wrap">

    <!-- Full HUD — always visible during play -->
    <div id="ui">
      <span>🎮 <span id="level">1</span></span>
      <span>⭐ <span id="score">0</span></span>
      <span>🏆 <span id="best">0</span></span>
      <span>❤️ <span id="lives">3</span></span>
      <span>♪ <span id="coins">0</span>/<span id="coins-total">0</span></span>
      <button id="btn-inventory">🎒</button>
      <button id="btn-settings">⚙</button>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- Mobile only: left/right buttons + jump -->
    <div id="touch-controls">
      <button class="tbtn tbtn-left" id="btn-left">◀</button>
      <button class="tbtn tbtn-right" id="btn-right">▶</button>
      <button class="tbtn tbtn-jump" id="btn-jump">▲</button>
      <button class="tbtn tbtn-pet hidden" id="btn-pet">🐾</button>
      <button class="tbtn tbtn-treat hidden" id="btn-treat">
        🐟<span id="treat-btn-count"></span>
        <svg class="treat-progress" viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <circle class="treat-ring" cx="34" cy="34" r="30"/>
        </svg>
      </button>
    </div>

    <button id="btn-action" class="hidden"></button>
    <button id="btn-action-secondary" class="hidden">RESTART FROM L1  ▶</button>

    <!-- Settings panel (⚙) -->
    <div id="settings-panel" class="hidden">
      <div class="settings-title">⚙ SETTINGS</div>
      <div class="settings-row">
        <span>Music</span>
        <button id="tog-music" class="tog-btn">ON</button>
      </div>
      <div class="settings-row">
        <span>Sound FX</span>
        <button id="tog-sfx" class="tog-btn">ON</button>
      </div>
      <!-- DEV: level jump — remove before shipping -->
      <div class="settings-row" id="dev-level-row" style="display:none">
        <span>Level</span>
        <div class="level-btns">
          <button class="level-btn" id="btn-level-1">1</button>
          <button class="level-btn" id="btn-level-2">2</button>
          <button class="level-btn" id="btn-level-3">3</button>
          <button class="level-btn" id="btn-level-4">4</button>
          <button class="level-btn" id="btn-level-5">5</button>
        </div>
      </div>
      <!-- Mobile-only: fullscreen + restart live here so touch-controls stay clean -->
      <div class="mobile-menu-actions">
        <button id="btn-panel-fs" class="menu-action-btn">⛶ &nbsp;Fullscreen</button>
        <button id="btn-panel-restart" class="menu-action-btn">↺ &nbsp;Restart</button>
      </div>
      <button id="btn-settings-close">✕ Close</button>
    </div>

    <!-- Inventory panel (🎒) -->
    <div id="inventory-panel" class="hidden">
      <div class="settings-title">🎒 INVENTORY</div>
      <div class="settings-row">
        <span>🐟 Treats: <span id="treat-count">0</span></span>
        <button id="btn-buy-treat" class="tog-btn">Buy (5000 pts)</button>
      </div>
      <div class="inv-note">Available from Level 4</div>
      <button id="btn-inventory-close">✕ Close</button>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
