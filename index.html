<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mario Rush</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Mobile only: shown in portrait via CSS (body.is-touch) -->
  <div id="landscape-prompt">
    <div class="rotate-anim">📱</div>
    <p>Rotate your device to play</p>
  </div>

  <!-- Mobile only: welcome / info modal -->
  <div id="welcome-modal">
    <div class="modal-box">
      <h1>🎵 Mario Rush</h1>
      <p>Collect music notes &nbsp;·&nbsp; Stomp enemies</p>
      <p>Hit <strong style="color:#FFD700">?</strong> boxes for music quizzes!</p>
      <div class="hint-row">
        <span>🕹 &nbsp;Drag to move</span>
        <span>▲ &nbsp;Jump</span>
        <span>↺ &nbsp;Restart</span>
      </div>
      <button id="btn-start">▶ &nbsp;TAP TO PLAY</button>
    </div>
  </div>

  <!-- Game container — JS scales this to fill the screen -->
  <div id="game-wrap">

    <!-- HUD lives inside the wrap so it scales with the game -->
    <div id="ui">
      <span>⭐ <span id="score">0</span></span>
      <span>❤️ <span id="lives">3</span></span>
      <span>♪ <span id="coins">0</span></span>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- Mobile only: virtual joystick + jump (Option C) -->
    <div id="touch-controls">
      <div id="joystick">
        <div id="joy-knob"></div>
      </div>
      <button class="tbtn tbtn-jump" id="btn-jump">▲</button>
      <button class="tbtn tbtn-fs" id="btn-fs">⛶</button>
      <button class="tbtn tbtn-restart" id="btn-restart">↺</button>
    </div>

    <div id="keydbg"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
