<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mario Rush</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="ui">
  <span>SCORE: <span id="score">0</span></span>
  <span>LIVES: <span id="lives">3</span></span>
  <span>NOTES: <span id="coins">0</span></span>
</div>

<canvas id="gameCanvas" width="800" height="450"></canvas>
<div id="keydbg"></div>

<div id="dpad">
  <button class="dbtn" id="btn-left">◀</button>
  <button class="dbtn" id="btn-jump">▲ Jump</button>
  <button class="dbtn" id="btn-right">▶</button>
  <button id="btn-restart">↺ Restart</button>
  <label id="img-label" for="img-input">🖼 Custom sprite</label>
  <input type="file" id="img-input" accept="image/*">
</div>

<!-- Requires a web server (e.g. VS Code Live Server) — ES modules don't load via file:// -->
<script type="module" src="js/main.js"></script>
</body>
</html>
